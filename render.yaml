services:
  - type: web
    name: gympro
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run db:migrate && pnpm run build:render
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATIC_DIR
        value: artifacts/gym-app/dist/public
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
