openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gym Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Auth and current user
  - name: users
    description: Staff user management
  - name: settings
    description: Gym settings
  - name: activity
    description: Activity logs
  - name: dashboard
    description: Dashboard KPIs and charts
  - name: members
    description: Member management
  - name: plans
    description: Subscription plans
  - name: payments
    description: Payments ledger
  - name: vouchers
    description: Cash vouchers
  - name: ledger
    description: Cash ledger
  - name: sales
    description: Sales / POS module
  - name: stock
    description: Stock and inventory management
  - name: accounts
    description: Accounts overview and accounting reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user profile with role and permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all non-deleted staff users
      responses:
        "200":
          description: List of staff users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a staff user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Soft-delete a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted (soft)

  /users/{id}/permissions:
    patch:
      operationId: updateUserPermissions
      tags: [users]
      summary: Update page permissions for a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsUpdate"
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get gym settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update gym settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get all dashboard KPI data and charts
      responses:
        "200":
          description: Dashboard KPI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity]
      summary: List activity logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all plans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members with filters and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: planId
          in: query
          schema: { type: integer }
        - name: expiryWindow
          in: query
          schema: { type: integer }
        - name: sortBy
          in: query
          schema: { type: string }
        - name: sortOrder
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersPage"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Archive (soft-delete) a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Archived

  /members/{id}/checkin:
    post:
      operationId: checkInMember
      tags: [members]
      summary: Check in a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"

  /members/{id}/renew:
    post:
      operationId: renewMember
      tags: [members]
      summary: Renew a member's membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/freeze:
    post:
      operationId: freezeMember
      tags: [members]
      summary: Freeze a member's membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/reactivate:
    post:
      operationId: reactivateMember
      tags: [members]
      summary: Reactivate a frozen or inactive member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/status:
    patch:
      operationId: setMemberStatus
      tags: [members]
      summary: Set member status (inactive, archived, active)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberStatusUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/payments:
    get:
      operationId: getMemberPayments
      tags: [members]
      summary: Get payment history for a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPayment"

  /members/{id}/checkins:
    get:
      operationId: getMemberCheckins
      tags: [members]
      summary: Get check-in history for a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Check-in history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckInRecord"

  /payments/summary:
    get:
      operationId: getPaymentSummary
      tags: [payments]
      summary: Get today's cash summary and current balance
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSummary"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments with filters and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsPage"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Cancel/archive a payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled

  /vouchers:
    get:
      operationId: listVouchers
      tags: [vouchers]
      summary: List vouchers
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: voucherType
          in: query
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated vouchers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VouchersPage"
    post:
      operationId: createVoucher
      tags: [vouchers]
      summary: Create a new voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "201":
          description: Created voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherRecord"

  /vouchers/{id}:
    get:
      operationId: getVoucher
      tags: [vouchers]
      summary: Get a single voucher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherRecord"
    patch:
      operationId: updateVoucher
      tags: [vouchers]
      summary: Update a voucher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherRecord"
    delete:
      operationId: deleteVoucher
      tags: [vouchers]
      summary: Cancel/archive a voucher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled

  /ledger:
    get:
      operationId: listLedger
      tags: [ledger]
      summary: List cash ledger entries
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"

  /ledger/balance:
    get:
      operationId: getLedgerBalance
      tags: [ledger]
      summary: Get current cash balance
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerBalance"

  /audit/run:
    get:
      operationId: runAudit
      summary: Run full system audit
      tags: [audit]
      responses:
        "200":
          description: Full audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /audit/fix/inventory:
    post:
      operationId: fixAuditInventory
      summary: Recalculate product inventory quantities
      tags: [audit]
      responses:
        "200":
          description: Fixed rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixed: { type: integer }
                  rows: { type: array, items: { type: object } }
                required: [fixed, rows]

  /audit/fix/dashboard:
    post:
      operationId: fixAuditDashboard
      summary: Rebuild dashboard KPI cache
      tags: [audit]
      responses:
        "200":
          description: Result message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /audit/fix/accounts:
    post:
      operationId: fixAuditAccounts
      summary: Rebuild account summaries
      tags: [audit]
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                type: object

  /attendance/list:
    get:
      operationId: listAttendance
      summary: Get filtered attendance list
      tags: [checkins]
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: memberSearch
          in: query
          schema: { type: string }
        - name: planName
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Filtered attendance list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceListResponse"

  /attendance/plans:
    get:
      operationId: listAttendancePlans
      summary: Get distinct plan names present in attendance data
      tags: [checkins]
      responses:
        "200":
          description: List of plan names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      summary: Get attendance summary cards
      tags: [checkins]
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummary"

  /attendance/daily:
    get:
      operationId: getAttendanceDaily
      summary: Get daily attendance chart data
      tags: [checkins]
      parameters:
        - name: days
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Daily attendance array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceDailyEntry"

  /attendance/monthly:
    get:
      operationId: getAttendanceMonthly
      summary: Get monthly attendance chart data
      tags: [checkins]
      parameters:
        - name: months
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Monthly attendance array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceMonthlyEntry"

  /attendance/hourly:
    get:
      operationId: getAttendanceHourly
      summary: Get hourly attendance distribution
      tags: [checkins]
      responses:
        "200":
          description: Hourly distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceHourlyEntry"

  /attendance/top-members:
    get:
      operationId: getAttendanceTopMembers
      summary: Get top attending members
      tags: [checkins]
      parameters:
        - name: limit
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Top members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceTopMember"

  /attendance/today:
    get:
      operationId: getAttendanceToday
      summary: Get today's check-ins
      tags: [checkins]
      responses:
        "200":
          description: Today's check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceCheckIn"

  /attendance/week:
    get:
      operationId: getAttendanceWeek
      summary: Get this week's check-ins
      tags: [checkins]
      responses:
        "200":
          description: This week's check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceCheckIn"

  /attendance/member/{id}:
    get:
      operationId: getMemberAttendanceStats
      summary: Get attendance stats for a specific member
      tags: [checkins]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member attendance statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberAttendanceStats"

  /notifications:
    get:
      operationId: listNotifications
      summary: Get all computed notifications with read state
      tags: [users]
      parameters:
        - name: type
          in: query
          schema: { type: string }
        - name: read
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"

  /notifications/count:
    get:
      operationId: getNotificationCount
      summary: Get unread notification count
      tags: [users]
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCountResponse"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  marked: { type: integer }
                required: [ok, marked]

  /notifications/{key}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark a single notification as read
