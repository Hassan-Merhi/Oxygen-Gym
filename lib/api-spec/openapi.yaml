openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gym Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Auth and current user
  - name: users
    description: Staff user management
  - name: settings
    description: Gym settings
  - name: activity
    description: Activity logs
  - name: dashboard
    description: Dashboard KPIs and charts
  - name: members
    description: Member management
  - name: plans
    description: Subscription plans
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user profile with role and permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all non-deleted staff users
      responses:
        "200":
          description: List of staff users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a staff user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Soft-delete a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted (soft)

  /users/{id}/permissions:
    patch:
      operationId: updateUserPermissions
      tags: [users]
      summary: Update page permissions for a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsUpdate"
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get gym settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update gym settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get all dashboard KPI data and charts
      responses:
        "200":
          description: Dashboard KPI data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /activity-logs:
    get:
      operationId: listActivityLogs
      tags: [activity]
      summary: List activity logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all plans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members with filters and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: planId
          in: query
          schema: { type: integer }
        - name: expiryWindow
          in: query
          schema: { type: integer }
        - name: sortBy
          in: query
          schema: { type: string }
        - name: sortOrder
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersPage"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Archive (soft-delete) a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Archived

  /members/{id}/checkin:
    post:
      operationId: checkInMember
      tags: [members]
      summary: Check in a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"

  /members/{id}/renew:
    post:
      operationId: renewMember
      tags: [members]
      summary: Renew a member's membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/freeze:
    post:
      operationId: freezeMember
      tags: [members]
      summary: Freeze a member's membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/reactivate:
    post:
      operationId: reactivateMember
      tags: [members]
      summary: Reactivate a frozen or inactive member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/status:
    patch:
      operationId: setMemberStatus
      tags: [members]
      summary: Set member status (inactive, archived, active)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberStatusUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/payments:
    get:
      operationId: getMemberPayments
      tags: [members]
      summary: Get payment history for a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPayment"

  /members/{id}/checkins:
    get:
      operationId: getMemberCheckins
      tags: [members]
      summary: Get check-in history for a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Check-in history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckInRecord"


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PagePermissions:
      type: object
      description: Per-page and per-feature permissions for a user
      properties:
        dashboard: { type: boolean }
        members: { type: boolean }
        plans: { type: boolean }
        staff: { type: boolean }
        payroll: { type: boolean }
        payments: { type: boolean }
        vouchers: { type: boolean }
        accounts: { type: boolean }
        stock: { type: boolean }
        sales: { type: boolean }
        settings: { type: boolean }
        viewCost: { type: boolean }
        viewProfit: { type: boolean }
        viewAccounting: { type: boolean }
        manageStaff: { type: boolean }
        manageSettings: { type: boolean }
        managePayroll: { type: boolean }
        manageInventory: { type: boolean }
        manageMembers: { type: boolean }
        managePlans: { type: boolean }
      required:
        - dashboard
        - members
        - plans
        - staff
        - payroll
        - payments
        - vouchers
        - accounts
        - stock
        - sales
        - settings
        - viewCost
        - viewProfit
        - viewAccounting
        - manageStaff
        - manageSettings
        - managePayroll
        - manageInventory
        - manageMembers
        - managePlans

    User:
      type: object
      properties:
        id: { type: integer }
        clerkUserId:
          type: ["string", "null"]
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - status
        - permissions
        - createdAt

    UserInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - name
        - email
        - role

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]

    PermissionsUpdate:
      type: object
      properties:
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - permissions

    CurrentUser:
      type: object
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, manager, staff]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - id
        - clerkUserId
        - name
        - email
        - role
        - permissions

    Settings:
      type: object
      properties:
        id: { type: integer }
        gymName: { type: string }
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
          enum: [USD, CDF]
        usdToCdfRate: { type: number }
        language:
          type: string
          enum: [en, fr, ar]
        logoUrl:
          type: ["string", "null"]
        receiptLogoUrl:
          type: ["string", "null"]
        receiptHeader:
          type: ["string", "null"]
        receiptFooter:
          type: ["string", "null"]
        membershipCardFooter:
          type: ["string", "null"]
        backupEnabled: { type: string }
        backupTime: { type: string }
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - gymName
        - defaultCurrency
        - usdToCdfRate
        - language
        - backupEnabled
        - backupTime
        - updatedAt

    SettingsUpdate:
      type: object
      properties:
        gymName: { type: string }
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
          enum: [USD, CDF]
        usdToCdfRate: { type: number }
        language:
          type: string
          enum: [en, fr, ar]
        logoUrl:
          type: ["string", "null"]
        receiptLogoUrl:
          type: ["string", "null"]
        receiptHeader:
          type: ["string", "null"]
        receiptFooter:
          type: ["string", "null"]
        membershipCardFooter:
          type: ["string", "null"]
        backupEnabled: { type: string }
        backupTime: { type: string }

    ActivityLog:
      type: object
      properties:
        id: { type: integer }
        userId:
          type: ["integer", "null"]
        userName: { type: string }
        action: { type: string }
        entity:
          type: ["string", "null"]
        entityId:
          type: ["integer", "null"]
        details: {}
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userName
        - action
        - createdAt

    MonthlyMetric:
      type: object
      properties:
        current: { type: number }
        previous: { type: number }
        changePercent: { type: number }
      required: [current, previous, changePercent]

    ChartPoint:
      type: object
      properties:
        month: { type: string }
        amount: { type: number }
      required: [month, amount]

    GrowthPoint:
      type: object
      properties:
        month: { type: string }
        count: { type: integer }
      required: [month, count]

    HourlyPoint:
      type: object
      properties:
        hour: { type: integer }
        count: { type: integer }
      required: [hour, count]

    ExpiringMember:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        planName:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date-time
        daysRemaining: { type: integer }
      required: [id, name, daysRemaining]

    LowStockProduct:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        alertQuantity: { type: integer }
      required: [id, name, quantity, alertQuantity]

    DashboardKpis:
      type: object
      properties:
        activeMembers:
          type: object
          properties:
            count: { type: integer }
          required: [count]
        monthlyRevenue:
          allOf:
            - $ref: "#/components/schemas/MonthlyMetric"
            - type: object
              properties:
                currency: { type: string }
              required: [currency]
        monthlyExpenses:
          $ref: "#/components/schemas/MonthlyMetric"
        todayCheckins:
          type: object
          properties:
            count: { type: integer }
            hourly:
              type: array
              items:
                $ref: "#/components/schemas/HourlyPoint"
          required: [count, hourly]
        expiringSoon:
          type: object
          properties:
            in7Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
            in14Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
            in30Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
          required: [in7Days, in14Days, in30Days]
        lowStock:
          type: array
          items:
            $ref: "#/components/schemas/LowStockProduct"
        profit:
          $ref: "#/components/schemas/MonthlyMetric"
        revenueChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        expenseChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        membershipGrowth:
          type: array
          items:
            $ref: "#/components/schemas/GrowthPoint"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
      required:
        - activeMembers
        - monthlyRevenue
        - monthlyExpenses
        - todayCheckins
        - expiringSoon
        - lowStock
        - profit
        - revenueChart
        - expenseChart
        - membershipGrowth
        - recentActivity

    Plan:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        durationDays: { type: integer }
        price: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, durationDays, price, currency, status]

    PlanInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        durationDays: { type: integer }
        price: { type: number }
        currency: { type: string, enum: [USD, CDF] }
        status: { type: string, enum: [active, archived] }
      required: [name, durationDays, price, currency]

    Member:
      type: object
      properties:
        id: { type: integer }
        memberNumber: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergencyContact: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        planId: { type: integer, nullable: true }
        planName: { type: string, nullable: true }
        planPrice: { type: number, nullable: true }
        status: { type: string }
        joinDate: { type: string }
        startDate: { type: string, nullable: true }
        expiryDate: { type: string, nullable: true }
        lastCheckIn: { type: string, nullable: true }
        amountPaid: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        balance: { type: number, nullable: true }
        currency: { type: string }
        frozenAt: { type: string, nullable: true }
        frozenUntil: { type: string, nullable: true }
        frozenDays: { type: integer, nullable: true }
        photoUrl: { type: string, nullable: true }
        fingerprintId: { type: string, nullable: true }
        qrCodeId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, status, currency, joinDate, createdAt, updatedAt]

    MemberInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergencyContact: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        joinDate: { type: string, nullable: true }
        planId: { type: integer, nullable: true }
        startDate: { type: string, nullable: true }
        expiryDate: { type: string, nullable: true }
        status: { type: string }
        amountPaid: { type: number }
        discount: { type: number }
        currency: { type: string, enum: [USD, CDF] }
        photoUrl: { type: string, nullable: true }
        fingerprintId: { type: string, nullable: true }
        qrCodeId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
      required: [name, status, currency, amountPaid, discount]

    MemberUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergencyContact: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        joinDate: { type: string, nullable: true }
        planId: { type: integer, nullable: true }
        startDate: { type: string, nullable: true }
        expiryDate: { type: string, nullable: true }
        status: { type: string, nullable: true }
        amountPaid: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        fingerprintId: { type: string, nullable: true }
        qrCodeId: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    MembersPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [items, total, page, limit]

    CheckInBody:
      type: object
      properties:
        force:
          type: boolean
          description: Override duplicate same-day check-in
      required: []

    CheckInResult:
      type: object
      properties:
        success: { type: boolean }
        alreadyCheckedIn: { type: boolean }
        checkIn:
          $ref: "#/components/schemas/CheckInRecord"
      required: [success, alreadyCheckedIn]

    CheckInRecord:
      type: object
      properties:
        id: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        memberNumber: { type: string, nullable: true }
        checkedInAt: { type: string }
        note: { type: string, nullable: true }
      required: [id, memberId, memberName, checkedInAt]

    RenewBody:
      type: object
      properties:
        planId: { type: integer }
        startDate: { type: string }
        expiryDate: { type: string }
        amountPaid: { type: number }
        discount: { type: number }
        currency: { type: string, enum: [USD, CDF] }
        notes: { type: string, nullable: true }
      required: [planId, startDate, expiryDate, amountPaid, discount, currency]

    FreezeBody:
      type: object
      properties:
        frozenAt: { type: string }
        frozenUntil: { type: string }
        reason: { type: string, nullable: true }
      required: [frozenAt, frozenUntil]

    MemberStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, archived]
      required: [status]

    MemberPayment:
      type: object
      properties:
        id: { type: integer }
        paymentNumber: { type: string, nullable: true }
        type: { type: string }
        amount: { type: number }
        discount: { type: number }
        currency: { type: string }
        planName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, type, amount, discount, currency, createdAt]
