components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PagePermissions:
      type: object
      description: Per-page and per-feature permissions for a user
      properties:
        dashboard: { type: boolean }
        members: { type: boolean }
        plans: { type: boolean }
        staff: { type: boolean }
        payroll: { type: boolean }
        payments: { type: boolean }
        vouchers: { type: boolean }
        accounts: { type: boolean }
        stock: { type: boolean }
        sales: { type: boolean }
        settings: { type: boolean }
        viewCost: { type: boolean }
        viewProfit: { type: boolean }
        viewAccounting: { type: boolean }
        manageStaff: { type: boolean }
        manageSettings: { type: boolean }
        managePayroll: { type: boolean }
        manageInventory: { type: boolean }
        manageMembers: { type: boolean }
        managePlans: { type: boolean }
      required:
        - dashboard
        - members
        - plans
        - staff
        - payroll
        - payments
        - vouchers
        - accounts
        - stock
        - sales
        - settings
        - viewCost
        - viewProfit
        - viewAccounting
        - manageStaff
        - manageSettings
        - managePayroll
        - manageInventory
        - manageMembers
        - managePlans

    User:
      type: object
      properties:
        id: { type: integer }
        clerkUserId:
          type: ["string", "null"]
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
        deletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - status
        - permissions
        - createdAt

    UserInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - name
        - email
        - role

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, staff]
        status:
          type: string
          enum: [active, inactive]

    PermissionsUpdate:
      type: object
      properties:
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - permissions

    CurrentUser:
      type: object
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, manager, staff]
        permissions:
          $ref: "#/components/schemas/PagePermissions"
      required:
        - id
        - clerkUserId
        - name
        - email
        - role
        - permissions

    Settings:
      type: object
      properties:
        id: { type: integer }
        gymName: { type: string }
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
          enum: [USD, CDF]
        usdToCdfRate: { type: number }
        language:
          type: string
          enum: [en, fr, ar]
        logoUrl:
          type: ["string", "null"]
        receiptLogoUrl:
          type: ["string", "null"]
        receiptHeader:
          type: ["string", "null"]
        receiptFooter:
          type: ["string", "null"]
        membershipCardFooter:
          type: ["string", "null"]
        backupEnabled: { type: string }
        backupTime: { type: string }
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - gymName
        - defaultCurrency
        - usdToCdfRate
        - language
        - backupEnabled
        - backupTime
        - updatedAt

    SettingsUpdate:
      type: object
      properties:
        gymName: { type: string }
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
          enum: [USD, CDF]
        usdToCdfRate: { type: number }
        language:
          type: string
          enum: [en, fr, ar]
        logoUrl:
          type: ["string", "null"]
        receiptLogoUrl:
          type: ["string", "null"]
        receiptHeader:
          type: ["string", "null"]
        receiptFooter:
          type: ["string", "null"]
        membershipCardFooter:
          type: ["string", "null"]
        backupEnabled: { type: string }
        backupTime: { type: string }

    ActivityLog:
      type: object
      properties:
        id: { type: integer }
        userId:
          type: ["integer", "null"]
        userName: { type: string }
        action: { type: string }
        entity:
          type: ["string", "null"]
        entityId:
          type: ["integer", "null"]
        details: {}
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userName
        - action
        - createdAt

    MonthlyMetric:
      type: object
      properties:
        current: { type: number }
        previous: { type: number }
        changePercent: { type: number }
      required: [current, previous, changePercent]

    ChartPoint:
      type: object
      properties:
        month: { type: string }
        amount: { type: number }
      required: [month, amount]

    GrowthPoint:
      type: object
      properties:
        month: { type: string }
        count: { type: integer }
      required: [month, count]

    HourlyPoint:
      type: object
      properties:
        hour: { type: integer }
        count: { type: integer }
      required: [hour, count]

    ExpiringMember:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        planName:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date-time
        daysRemaining: { type: integer }
      required: [id, name, daysRemaining]

    LowStockProduct:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        alertQuantity: { type: integer }
      required: [id, name, quantity, alertQuantity]

    DashboardKpis:
      type: object
      properties:
        activeMembers:
          type: object
          properties:
            count: { type: integer }
          required: [count]
        monthlyRevenue:
          allOf:
            - $ref: "#/components/schemas/MonthlyMetric"
            - type: object
              properties:
                currency: { type: string }
              required: [currency]
        monthlyExpenses:
          $ref: "#/components/schemas/MonthlyMetric"
        todayCheckins:
          type: object
          properties:
            count: { type: integer }
            hourly:
              type: array
              items:
                $ref: "#/components/schemas/HourlyPoint"
          required: [count, hourly]
        expiringSoon:
          type: object
          properties:
            in7Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
            in14Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
            in30Days:
              type: array
              items:
                $ref: "#/components/schemas/ExpiringMember"
          required: [in7Days, in14Days, in30Days]
        lowStock:
          type: array
          items:
            $ref: "#/components/schemas/LowStockProduct"
        profit:
          $ref: "#/components/schemas/MonthlyMetric"
        revenueChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        expenseChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        membershipGrowth:
          type: array
          items:
            $ref: "#/components/schemas/GrowthPoint"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
      required:
        - activeMembers
        - monthlyRevenue
        - monthlyExpenses
        - todayCheckins
        - expiringSoon
        - lowStock
        - profit
        - revenueChart
        - expenseChart
        - membershipGrowth
        - recentActivity

    Plan:
      type: object
      properties:
        id: { type: integer }
        planNumber: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        durationDays: { type: integer }
        price: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, durationDays, price, currency, status]

    PlanInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        durationDays: { type: integer }
        price: { type: number }
        currency: { type: string, enum: [USD, CDF] }
        status: { type: string, enum: [active, archived] }
      required: [name, durationDays, price, currency]

    Member:
      type: object
      properties:
        id: { type: integer }
        memberNumber: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        emergencyContact: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        planId: { type: integer, nullable: true }
        planName: { type: string, nullable: true }
        planPrice: { type: number, nullable: true }
        status: { type: string }
        joinDate: { type: string }
        startDate: { type: string, nullable: true }
        expiryDate: { type: string, nullable: true }
        lastCheckIn: { type: string, nullable: true }
        amountPaid: { type: number, nullable: true }
        discount: { type: number, nullable: true }
        balance: { type: number, nullable: true }
        currency: { type: string }
        frozenAt: { type: string, nullable: true }
        frozenUntil: { type: string, nullable: true }
        frozenDays: { type: integer, nullable: true }
        photoUrl: { type: string, nullable: true }
        fingerprintId: { type: string, nullable: true }
        qrCodeId: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, name, status, currency, joinDate, createdAt, updatedAt]

    MemberInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
