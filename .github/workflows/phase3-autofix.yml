name: Phase 3 Autofix

on:
  push:
    branches:
      - phase-3/contracts-boundaries-architecture
    paths:
      - scripts/phase3-autofix.mjs
      - .github/workflows/phase3-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/contracts-boundaries-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply codemod
        run: node scripts/phase3-autofix.mjs
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "Phase 3 Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/routes
          git commit -m "Phase 3: type authenticated route context"
          git push origin HEAD:phase-3/contracts-boundaries-architecture
