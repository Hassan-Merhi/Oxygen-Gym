name: Phase 3 Autofix

on:
  push:
    branches:
      - phase-3/contracts-boundaries-architecture
    paths:
      - scripts/phase3-autofix.mjs
      - scripts/phase3-openapi-sync.mjs
      - scripts/src/architecture-audit.ts
      - artifacts/api-server/src/http/contracts.ts
      - artifacts/api-server/src/app.ts
      - lib/api-zod/tsconfig.json
      - lib/api-spec/openapi.yaml
      - package.json
      - .github/workflows/phase3-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/contracts-boundaries-architecture
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Synchronize missing OpenAPI paths
        run: node scripts/phase3-openapi-sync.mjs
      - name: Regenerate API clients and Zod contracts
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Apply request-contract codemod
        run: node scripts/phase3-autofix.mjs
      - name: Commit architecture fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
          else
            git config user.name "Phase 3 Architecture Bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              lib/api-spec/openapi.yaml \
              lib/api-zod/src/generated \
              lib/api-client-react/src/generated \
              artifacts/api-server/src/routes
            git commit -m "Phase 3: synchronize contracts and request boundaries"
            git push origin HEAD:phase-3/contracts-boundaries-architecture
          fi
      - name: Validate full Phase 3 architecture gate
        run: pnpm run architecture:check
