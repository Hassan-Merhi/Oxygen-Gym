name: Architecture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract drift
        run: pnpm run contracts:check
      - name: Architecture boundaries
        run: pnpm run architecture:audit
      - name: Type safety
        run: pnpm run typecheck
