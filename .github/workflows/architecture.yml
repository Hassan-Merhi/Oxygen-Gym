name: Architecture

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - phase-3/contracts-boundaries-architecture

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contracts, boundaries, and types
        run: pnpm run architecture:check
      - name: Validate production build
        run: pnpm run build
