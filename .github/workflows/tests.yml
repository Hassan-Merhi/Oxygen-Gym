name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  critical-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxygen_gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxygen_gym_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run critical behavioral unit tests
        run: pnpm run test:critical
      - name: Validate migration architecture
        run: pnpm --filter @workspace/db run check:architecture
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm run db:migrate
      - name: Verify migration idempotency
        run: pnpm run db:migrate
      - name: Verify financial atomicity and idempotency
        run: pnpm --filter @workspace/db run check:atomicity
      - name: Verify accounting model and precision
        run: pnpm --filter @workspace/db run check:accounting

  ui-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxygen_gym_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxygen_gym_ui
      UI_BASE_URL: http://localhost:8090
      UI_USER: admin
      UI_PASSWORD: admin123
      UI_LANGS: en,fr,ar
      UI_SHOTS_DIR: ${{ github.workspace }}/ui-shots
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save playwright@1.56.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm run db:migrate
      - name: Build the web app and API
        run: pnpm run build:render
      - name: Start the API serving the built app
        run: |
          NODE_ENV=development PORT=8090 STATIC_DIR=artifacts/gym-app/dist/public \
          SESSION_SECRET=ui-responsive-ci-session-secret-0000 \
          nohup node artifacts/api-server/dist/index.mjs > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$UI_BASE_URL/api/auth/setup" > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Seed demo data through the API
        run: node tests/ui-seed.mjs
      - name: Phone, iPad and desktop layout checks (en, fr, ar)
        run: NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node tests/ui-responsive.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: |
            ui-shots
            api.log
          if-no-files-found: ignore
