name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  critical-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxygen_gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxygen_gym_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run critical behavioral unit tests
        run: pnpm run test:critical
      - name: Validate migration architecture
        run: pnpm --filter @workspace/db run check:architecture
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm run db:migrate
      - name: Verify migration idempotency
        run: pnpm run db:migrate
      - name: Verify financial atomicity and idempotency
        run: pnpm --filter @workspace/db run check:atomicity
      - name: Verify accounting model and precision
        run: pnpm --filter @workspace/db run check:accounting
