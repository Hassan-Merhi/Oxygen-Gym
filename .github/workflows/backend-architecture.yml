name: Backend Architecture

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/gym-app/**"
      - "lib/db/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "render.yaml"
      - ".github/workflows/backend-architecture.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/gym-app/**"
      - "lib/db/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oxygen_gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oxygen_gym_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate DB migration architecture
        run: pnpm --filter @workspace/db run check:architecture
      - name: Validate DB admin scripts
        run: pnpm --filter @workspace/db run check:scripts
      - name: Apply versioned migrations to fresh PostgreSQL
        run: pnpm run db:migrate
      - name: Verify migrations are idempotent
        run: pnpm run db:migrate
      - name: Verify financial atomicity and idempotency
        run: pnpm --filter @workspace/db run check:atomicity
      - name: Verify accounting model and precision
        run: pnpm --filter @workspace/db run check:accounting
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Build production backend
        run: pnpm --filter @workspace/api-server run build
