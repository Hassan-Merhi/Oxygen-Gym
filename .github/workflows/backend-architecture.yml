name: Backend Architecture

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "render.yaml"
      - ".github/workflows/backend-architecture.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate DB migration architecture
        run: pnpm --filter @workspace/db run check:architecture
      - name: Validate DB admin scripts
        run: pnpm --filter @workspace/db run check:scripts
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Build production backend
        run: pnpm --filter @workspace/api-server run build
