name: Phase 1 Ledger Contract Autofix

on:
  push:
    branches:
      - fix/phase1-ledger-movements-contract

permissions:
  contents: write

jobs:
  generate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add ledger movements OpenAPI contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/api-spec/openapi.yaml')
          text = path.read_text()
          if '  /ledger/movements:\n' not in text:
              anchor = '  /ledger/opening-balance:\n'
              if anchor not in text:
                  raise SystemExit('ledger opening-balance anchor not found')
              block = '''  /ledger/movements:
    get:
      operationId: listCurrentCashMovements
      tags: [ledger]
      summary: List current cash movements revalued at the live exchange rate
      responses:
        "200":
          description: Current cash movements
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchangeRate: { type: number }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sourceType: { type: string }
                        sourceId: { type: integer, nullable: true }
                        sourceNumber: { type: string, nullable: true }
                        date: { type: string, format: date-time }
                        direction: { type: string, enum: [in, out] }
                        category: { type: string }
                        amount: { type: number }
                        currency: { type: string }
                        exchangeRate: { type: number }
                        amountUsd: { type: number }
                        amountCdf: { type: number }
                        description: { type: string }
                        party: { type: string }
                      required: [sourceType, sourceId, sourceNumber, date, direction, category, amount, currency, exchangeRate, amountUsd, amountCdf, description, party]
                required: [exchangeRate, items]

'''
              path.write_text(text.replace(anchor, block + anchor, 1))
          PY
      - name: Regenerate API clients and Zod contracts
        run: pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
      - name: Commit generated contract closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase1-ledger-contract-autofix.yml
          git add lib/api-spec/openapi.yaml lib/api-client-react/src/generated lib/api-zod/src/generated
          git commit -m "fix: add ledger movements API contract"
          git push origin HEAD:fix/phase1-ledger-movements-contract
