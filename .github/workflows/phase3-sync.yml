name: Phase 3 Main Sync

on:
  push:
    branches:
      - phase-3/contracts-boundaries-architecture
    paths:
      - .github/workflows/phase3-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3/contracts-boundaries-architecture
          fetch-depth: 0
      - name: Merge current main and resolve architecture moves
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Phase 3 Main Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e

          if [ "$merge_code" -ne 0 ]; then
            echo "Resolving expected architecture conflicts from the domain refactor."

            # Main moved these legacy route modules into domain routers. Keep the
            # new domain ownership rather than reviving deleted duplicate routes.
            git rm -f -- \
              artifacts/api-server/src/routes/accounts.ts \
              artifacts/api-server/src/routes/ledger.ts \
              artifacts/api-server/src/routes/members.ts \
              artifacts/api-server/src/routes/payments.ts \
              artifacts/api-server/src/routes/payroll.ts \
              artifacts/api-server/src/routes/sales.ts \
              artifacts/api-server/src/routes/settings.ts \
              artifacts/api-server/src/routes/stock.ts \
              artifacts/api-server/src/routes/supplier-credits.ts \
              artifacts/api-server/src/routes/vouchers.ts

            # Preserve the newer domain implementation/data audits from main.
            git checkout --theirs -- \
              artifacts/api-server/src/domains/accounting/financials-service.ts \
              artifacts/api-server/src/routes/audit.ts
            git add \
              artifacts/api-server/src/domains/accounting/financials-service.ts \
              artifacts/api-server/src/routes/audit.ts

            # Combine main's atomic mutation/error middleware with Phase 3's
            # centralized environment and OpenAPI contract error boundary.
            cat > artifacts/api-server/src/app.ts <<'APP_EOF'
          import express, { type Express } from "express";
          import cors from "cors";
          import pinoHttp from "pino-http";
          import path from "path";
          import router from "./routes";
          import { logger } from "./lib/logger";
          import { env } from "./config/env";
          import { contractErrorHandler } from "./http/contracts";
          import { errorHandler } from "./shared/http/errors";
          import { mutationRequestContext } from "./shared/http/idempotency-context";

          const app: Express = express();

          app.use(
            pinoHttp({
              logger,
              serializers: {
                req(req) {
                  return {
                    id: req.id,
                    method: req.method,
                    url: req.url?.split("?")[0],
                  };
                },
                res(res) {
                  return { statusCode: res.statusCode };
                },
              },
            }),
          );

          app.use(cors({ credentials: true, origin: true }));
          app.use(express.json());
          app.use(express.urlencoded({ extended: true }));
          app.use(mutationRequestContext);

          const uploadDir = path.resolve(process.cwd(), "uploads");
          app.use("/api/uploads", express.static(uploadDir));
          app.use("/api", router);

          // Contract violations are normalized before the general domain error mapper.
          app.use(contractErrorHandler);

          if (env.staticDir) {
            const resolvedStaticDir = path.resolve(env.staticDir);
            app.use(express.static(resolvedStaticDir));
            app.get("/{*splat}", (_req, res) => {
              res.sendFile(path.join(resolvedStaticDir, "index.html"));
            });
          }

          app.use(errorHandler);

          export default app;
          APP_EOF

            # Runtime startup must not mutate schema/data. Keep Phase 3's job
            # separation, but use the explicit deployment migration command from main.
            cat > artifacts/api-server/src/index.ts <<'INDEX_EOF'
          import app from "./app";
          import { env } from "./config/env";
          import { scheduleBackgroundJobs } from "./jobs/scheduler";
          import { logger } from "./lib/logger";

          scheduleBackgroundJobs();

          app.listen(env.port, (err) => {
            if (err) {
              logger.error({ err }, "Error listening on port");
              process.exit(1);
            }
            logger.info({ port: env.port, nodeEnv: env.nodeEnv }, "Server listening");
          });
          INDEX_EOF

            # Preserve main's durable idempotency transport while keeping client
            # runtime configuration centralized.
            cat > artifacts/gym-app/src/main.tsx <<'CLIENT_EOF'
          import { createRoot } from "react-dom/client";
          import App from "./App";
          import "./index.css";
          import { setBaseUrl } from "@workspace/api-client-react";
          import { AUTH_TOKEN_KEY, clientEnv } from "@/config/env";

          const apiBase = clientEnv.apiBaseUrl;
          if (apiBase) setBaseUrl(apiBase);

          const nativeFetch = window.fetch.bind(window);
          const mutationKeys = new Map<string, { key: string; expiresAt: number }>();
          const MUTATING_METHODS = new Set(["POST", "PUT", "PATCH", "DELETE"]);

          function newIdempotencyKey(): string {
            if (typeof globalThis.crypto?.randomUUID === "function") return globalThis.crypto.randomUUID();
            return `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
          }

          function releaseMutationKey(fingerprint: string, key: string, delayMs: number): void {
            window.setTimeout(() => {
              const current = mutationKeys.get(fingerprint);
              if (current?.key === key) mutationKeys.delete(fingerprint);
            }, delayMs);
          }

          window.fetch = async (input: RequestInfo | URL, init?: RequestInit) => {
            const inputIsRequest = typeof Request !== "undefined" && input instanceof Request;
            const rawUrl = typeof input === "string"
              ? input
              : input instanceof URL
                ? input.toString()
                : input.url;
            const relativeApiRequest = rawUrl.startsWith("/api/");
            const configuredApiRequest = Boolean(apiBase && rawUrl.startsWith(`${apiBase}/api/`));

            if (!relativeApiRequest && !configuredApiRequest) return nativeFetch(input, init);

            const token = localStorage.getItem(AUTH_TOKEN_KEY);
            const headers = new Headers(inputIsRequest ? input.headers : undefined);
            new Headers(init?.headers).forEach((value, key) => headers.set(key, value));
            if (token && !headers.has("authorization")) headers.set("authorization", `Bearer ${token}`);

            const method = (init?.method ?? (inputIsRequest ? input.method : "GET")).toUpperCase();
            let fingerprint: string | undefined;
            let idempotencyKey: string | undefined;

            if (MUTATING_METHODS.has(method) && !headers.has("idempotency-key")) {
              let body = typeof init?.body === "string" ? init.body : "";
              if (!body && inputIsRequest) {
                try {
                  body = await input.clone().text();
                } catch {
                  body = "";
                }
              }

              fingerprint = `${method}\n${rawUrl}\n${body}`;
              const now = Date.now();
              const existing = mutationKeys.get(fingerprint);
              if (existing && existing.expiresAt > now) {
                idempotencyKey = existing.key;
              } else {
                idempotencyKey = newIdempotencyKey();
                mutationKeys.set(fingerprint, { key: idempotencyKey, expiresAt: now + 5 * 60_000 });
              }
              headers.set("Idempotency-Key", idempotencyKey);
            }

            const resolvedUrl = relativeApiRequest && apiBase ? `${apiBase}${rawUrl}` : rawUrl;

            try {
              const response = inputIsRequest
                ? await nativeFetch(input, { ...init, method, headers })
                : await nativeFetch(resolvedUrl, { ...init, method, headers });

              if (fingerprint && idempotencyKey) {
                releaseMutationKey(
                  fingerprint,
                  idempotencyKey,
                  response.ok ? 5_000 : 5 * 60_000,
                );
              }
              return response;
            } catch (error) {
              if (fingerprint && idempotencyKey) {
                releaseMutationKey(fingerprint, idempotencyKey, 5 * 60_000);
              }
              throw error;
            }
          };

          createRoot(document.getElementById("root")!).render(<App />);
          CLIENT_EOF

            # Combine deployment migrations from main with the permanent Phase 3 gates.
            cat > package.json <<'PACKAGE_EOF'
          {
            "name": "workspace",
            "version": "0.0.0",
            "license": "MIT",
            "scripts": {
              "preinstall": "sh -c 'rm -f package-lock.json yarn.lock; case \"$npm_config_user_agent\" in pnpm/*) ;; *) echo \"Use pnpm instead\" >&2; exit 1 ;; esac'",
              "build": "pnpm run typecheck && pnpm -r --if-present run build",
              "typecheck:libs": "tsc --build",
              "typecheck": "pnpm run typecheck:libs && pnpm -r --filter \"./artifacts/**\" --filter \"./scripts\" --if-present run typecheck",
              "architecture:audit": "pnpm --filter @workspace/scripts run architecture:audit",
              "contracts:check": "pnpm --filter @workspace/scripts run contracts:check",
              "architecture:check": "pnpm run contracts:check && pnpm run architecture:audit && pnpm run typecheck",
              "db:migrate": "pnpm --filter @workspace/db run migrate",
              "dev:desktop": "pnpm --filter @workspace/desktop run dev:desktop",
              "build:web": "pnpm --filter @workspace/desktop run build:web",
              "build:desktop": "pnpm --filter @workspace/desktop run build:desktop",
              "dist:windows": "pnpm --filter @workspace/desktop run dist:windows",
              "build:render": "PORT=3000 BASE_PATH=/ pnpm --filter @workspace/gym-app run build && pnpm --filter @workspace/api-server run build"
            },
            "private": true,
            "devDependencies": {
              "prettier": "^3.8.3",
              "typescript": "~5.9.3"
            }
          }
          PACKAGE_EOF

            # The previous startup migration module performed runtime schema/data
            # mutation (including a legacy cash wipe); deployment migrations now own that.
            git rm -f -- artifacts/api-server/src/migrations/startup.ts

            git add \
              artifacts/api-server/src/app.ts \
              artifacts/api-server/src/index.ts \
              artifacts/gym-app/src/main.tsx \
              package.json
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          git add -A
          git commit -m "Merge current main into Phase 3 architecture branch"
          git push origin HEAD:phase-3/contracts-boundaries-architecture
